[project]
name = "gdoc-poc-py"
version = "0.1.0"
description = "Reimplementação do GDocs to HTML parser em Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic-settings>=2.2.1",
    "google-api-python-client>=2.122.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "python-multipart>=0.0.9",
    "playwright>=1.60.0",
    "weasyprint>=60.0",
]

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
]
